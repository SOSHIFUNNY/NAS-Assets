<script>
(() => {
  const control = document.getElementById('ringControl');
  const segments = Array.from(document.querySelectorAll('.segment'));
  const circumference = 2 * Math.PI * 72;
  const speed = 0.3; // pixels per animation frame
  let position = 0;
  let direction = 1;

  function render() {
    segments.forEach(segment => {
      const start = Number(segment.dataset.start);
      segment.style.strokeDashoffset = String(-(start + position));
    });
  }

  function toggleDirection() {
    direction *= -1;
  }

  control.addEventListener('click', toggleDirection);
  control.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleDirection();
    }
  });

  function animate() {
    position = (position + direction * speed + circumference) % circumference;
    render();
    requestAnimationFrame(animate);
  }

  render();
  requestAnimationFrame(animate);
})();
</script>
